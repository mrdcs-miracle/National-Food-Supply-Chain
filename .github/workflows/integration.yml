# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Ensure npm@9 (supports lockfile v3)
        run: |
          npm --version || true
          corepack enable || true
          corepack prepare npm@9 --activate || true
          npm --version
      - name: Debug: print Node & repo info
        run: |
          node --version || true
          npm --version || true
          echo "-- ls -la --"
          ls -la
          echo "-- package-lock.json header --"
          if [ -f package-lock.json ]; then sed -n '1,40p' package-lock.json; else echo "no package-lock.json"; fi
      - run: npm ci
      - run: npm run build

  unit-tests:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Ensure npm@9 (supports lockfile v3)
        run: |
          npm --version || true
          corepack enable || true
          corepack prepare npm@9 --activate || true
          npm --version
      - run: npm ci
      - run: npm test --if-present
